name: Validación de Pull Request

on:
  pull_request:
    branches:
      - developer
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validar:
    name: Compilar, probar y validar
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      #- name: Validar formato
      #  run: npm run format:check

      - name: Validar código
        run: npm run lint -- --max-warnings=1

      - name: Ejecutar pruebas
        run: npm test -- --runInBand

      #- name: Compilar proyecto
      #  run: npm run build
